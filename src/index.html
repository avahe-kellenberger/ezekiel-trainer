<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Ezekiel Trainer</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="fonts/RuneScape-UF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/RuneScape-Plain-11.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/RuneScape-Plain-12.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "OSRS";
        src: url("fonts/RuneScape-UF.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Stats_11";
        src: url("fonts/RuneScape-Plain-11.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Stats_12";
        src: url("fonts/RuneScape-Plain-12.woff2") format("woff2");
        font-display: swap;
      }

      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #hud_corner {
        position: absolute;
        bottom: 4px;
        left: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: calc(100% - 8px);
        pointer-events: none;
      }

      #credits {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0 8px;
        font-size: 11px;
        text-shadow: 1px 1px 0 black;
      }

      #visual_ticks {
        display: flex;
        background: rgba(128, 128, 128, 0.5);
        pointer-events: none;
      }

      #visual_ticks span {
        width: 30px;
        height: 30px;
      }

      #visual_ticks span[data-active="true"] {
        background: cyan;
      }

      #maker_credit {
        flex-basis: 100%;
        margin: 0;
      }

      #coming_soon {
        flex-basis: 100%;
        margin: 0;
      }

      #maker_links,
      #contributor_credit {
        display: block;
      }

      #maker_links a,
      #contributor_credit a {
        color: #ff981f;
        pointer-events: auto;
      }

      #credit_line {
        flex: 1 1 0;
        max-width: 60ch;
        margin: 0;
      }

      #app_version {
        margin: 0;
        white-space: nowrap;
        opacity: 0.8;
      }

      #drill_controls {
        position: relative;
        display: flex;
        gap: 4px;
        margin: 0;
        font-size: 12px;
        pointer-events: auto;
      }

      #drill_controls button,
      #run_result button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #settings_menu,
      #whats_new_panel,
      #run_result {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
      }

      #settings_menu {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        display: grid;
        gap: 6px;
        justify-items: start;
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px;
        white-space: nowrap;
      }

      #settings_menu[hidden],
      #whats_new_panel[hidden] {
        display: none;
      }

      #whats_new_panel {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        box-sizing: border-box;
        width: min(44ch, calc(100vw - 8px));
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px 12px;
      }

      #whats_new_panel h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #ffff00;
      }

      #whats_new_panel h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }

      #whats_new_panel ul {
        margin: 0 0 8px;
        padding-left: 16px;
        color: #fff;
      }

      #whats_new_panel li + li {
        margin-top: 4px;
      }

      #whats_new_close {
        position: sticky;
        bottom: 0;
      }

      .unseen_dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 4px;
        border-radius: 50%;
        background: #ff0000;
        box-shadow: 0 0 0 1px #000;
        vertical-align: middle;
      }

      #seed {
        width: 10ch;
      }

      #run_result {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        text-align: center;
        font-size: 14px;
      }

      #run_result h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #ffff00;
      }

      #run_result p {
        margin: 0 0 8px;
      }

      #game_chat {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #maker_credit a {
        color: #ff981f;
        pointer-events: auto;
      }

      #zeke_music { display: grid; gap: 4px; }
      #music_status { color: #fff; font-size: 11px; }
      #settings_menu input[type="number"] { width: 4ch; }
      #settings_menu hr { width: 100%; border: 0; border-top: 1px solid #756b58; }
      #zeke_help {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        width: min(42ch, calc(100vw - 32px));
        padding: 12px;
        background: #3e3529;
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        max-height: 65vh;
        overflow-y: auto;
      }
      #zeke_help[hidden] { display: none; }
      #zeke_help h2 { color: #ff981f; font-size: 15px; margin: 0; }
      #zeke_help p { line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
