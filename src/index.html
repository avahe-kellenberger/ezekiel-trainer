<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Ezekiel Trainer</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="fonts/RuneScape-UF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/RuneScape-Plain-11.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/RuneScape-Plain-12.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "OSRS";
        src: url("fonts/RuneScape-UF.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Stats_11";
        src: url("fonts/RuneScape-Plain-11.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: "Stats_12";
        src: url("fonts/RuneScape-Plain-12.woff2") format("woff2");
        font-display: swap;
      }

      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #hud_corner {
        position: absolute;
        bottom: 4px;
        left: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: calc(100% - 8px);
        pointer-events: none;
      }

      #credits {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0 8px;
        font-size: 11px;
        text-shadow: 1px 1px 0 black;
      }

      #visual_ticks {
        display: flex;
        background: rgba(128, 128, 128, 0.5);
        pointer-events: none;
      }

      #visual_ticks span {
        width: 30px;
        height: 30px;
      }

      #visual_ticks span[data-active="true"] {
        background: cyan;
      }

      #maker_credit {
        flex-basis: 100%;
        margin: 0;
      }

      #coming_soon {
        flex-basis: 100%;
        margin: 0;
      }

      #maker_links,
      #contributor_credit {
        display: block;
      }

      #maker_links a,
      #contributor_credit a {
        color: #ff981f;
        pointer-events: auto;
      }

      #credit_line {
        flex: 1 1 0;
        max-width: 60ch;
        margin: 0;
      }

      #app_version {
        margin: 0;
        white-space: nowrap;
        opacity: 0.8;
      }

      #drill_controls {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
        font-size: 12px;
        pointer-events: auto;
      }

      #drill_controls button,
      #run_result button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #settings_menu,
      #whats_new_panel,
      #run_result {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
      }

      #settings_menu {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        display: grid;
        gap: 6px;
        justify-items: start;
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px;
        white-space: nowrap;
      }

      #settings_menu[hidden],
      #whats_new_panel[hidden] {
        display: none;
      }

      #whats_new_panel {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        box-sizing: border-box;
        width: min(44ch, calc(100vw - 8px));
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px 12px;
      }

      #whats_new_panel h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #ffff00;
      }

      #whats_new_panel h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }

      #whats_new_panel ul {
        margin: 0 0 8px;
        padding-left: 16px;
        color: #fff;
      }

      #whats_new_panel li + li {
        margin-top: 4px;
      }

      #whats_new_close {
        position: sticky;
        bottom: 0;
      }

      .unseen_dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 4px;
        border-radius: 50%;
        background: #ff0000;
        box-shadow: 0 0 0 1px #000;
        vertical-align: middle;
      }

      #seed {
        width: 10ch;
      }

      #run_result {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        text-align: center;
        font-size: 14px;
      }

      #run_result h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #ffff00;
      }

      #run_result p {
        margin: 0 0 8px;
      }

      #game_chat {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #maker_credit a {
        color: #ff981f;
        pointer-events: auto;
      }

      #zeke_music { display: grid; gap: 4px; }
      #settings_menu .audio_setting {
        display: grid;
        grid-template-columns: 13ch minmax(90px, 150px);
        align-items: center;
        gap: 6px;
        width: 100%;
      }
      .audio_setting input[type="range"] { width: 100%; margin: 0; }
      #drill_controls .icon_button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 4px; flex-shrink: 0; }
      #drill_controls button:disabled { cursor: default; opacity: 0.5; }
      #music_status { color: #fff; font-size: 11px; }
      #settings_menu input[type="number"] { width: 4ch; }
      #settings_menu hr { width: 100%; border: 0; border-top: 1px solid #756b58; }
      #route_scenarios {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        z-index: 5;
        width: min(350px, calc(100vw - 32px));
        max-height: calc(100vh - 175px);
        overflow-y: auto;
        padding: 12px;
        background: #292b30;
        border: 1px solid #878179;
        box-shadow: 0 8px 30px #0009;
        color: #eee;
      }
      #route_scenarios[hidden] { display: none; }
      .route_scenarios_heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .route_actions, .route_window_actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      #drill_controls .route_actions > button { min-height: 26px; }
      .route_window_actions { flex-shrink: 0; }
      #route_scenarios h2 { margin: 0; font-size: 16px; color: #ffbd6b; }
      #route_scenarios p { line-height: 1.4; margin: 10px 0; }
      .route_scenario_grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      #drill_controls .route_scenario_grid button { display: grid; justify-items: center; gap: 6px; padding: 8px 4px; background: #35383e; border: 1px solid #65686f; color: #eee; font-size: 11px; }
      #drill_controls .route_scenario_grid button:hover, #drill_controls .route_scenario_grid button:focus-visible { border-color: #ffbd6b; background: #44474e; }
      #drill_controls .route_scenario_grid button[aria-pressed="true"] { outline: 2px solid #ffbd6b; outline-offset: -2px; }
      .route_scenario_icon { width: 65px; height: 65px; }
      .route_legend { font-size: 11px; color: #ccc; }
      .route_legend span { display: inline-block; width: 9px; height: 9px; background: #c65050; margin-right: 4px; }
      #route_demo_status { position: fixed; left: 8px; top: 56px; z-index: 2; display: grid; gap: 5px; width: min(360px, calc(100vw - 32px)); box-sizing: border-box; padding: 9px 11px; background: #24272de8; border: 1px solid #858b95; color: #eee; }
      #route_demo_status strong { color: #ffbd6b; font-size: 13px; }
      #route_demo_status small { font-size: 10px; color: #b9bdc4; }
      #route_demo_status [data-kind="playing"] { color: #91d59d; }
      .route_path_toggle { display: flex; align-items: center; gap: 6px; }
      #show_solves[aria-pressed="true"] { background: #343f30; border-color: #9dbd7a; color: #d8edc1; }
      #route_demo_status [data-kind="failed"] { color: #ffa4a4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
